[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cao"
version = "0.0.0"
description = "Open-source AgentOps control plane for agentic runtimes"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []
keywords = ["agentops", "control-plane", "agents", "runtime", "orchestration"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
# The installed command must dispatch exactly what the source launcher `./cao`
# dispatches, so an installed CAO never offers a different command surface from a
# checkout. Groups this product CLI does not own are answered by the module that
# owns them (see ``cao.product_cli.main``), keeping every documented command.
cao = "cao.product_cli:main"
# A purpose-specific disposition control surface. It is separate from the
# product CLI and is the only entry that owns the four disposition verbs.
cao-disposition = "cao.disposition_cli:main"

# Runtime plugins register under the "cao.runtime_plugins" entry-point group.
# No plugin ships as a built-in default: an entry point registers a plugin, and
# ``PluginRegistry.discover`` only sees plugins that are actually installed.
[project.entry-points."cao.runtime_plugins"]
herdr = "cao.plugins.herdr:HerdrRuntimePlugin"

[tool.setuptools.packages.find]
where = ["src"]
